# Paths are relative to this TOML file. ${VARIABLE} placeholders are expanded.
[launcher]
project_dir = "${MOCOSSIM_LAUNCHER_DIR}"
base_config = "${MOCOSSIM_SEED_CONFIG}"
# Optional: julia_bin = "/absolute/path/to/julia-1.7.0/bin/julia"
# Input paths inside the seed JSON are relative to the seed JSON's directory.
# Set input_base_dir explicitly if the seed was authored relative to another directory.
output_dir = "../runs/saxony-temporal"
# One trajectory is simulated by one thread. More threads allocate extra simulation states.
threads = 1
num_trajectories = 1
timeout_seconds = 3600.0
compiled_modules = true
# Keep optional summary output off for the pinned launcher/MocosSim pair.
write_summary = false

[execution]
# Candidate concurrency; alias for execution.max_workers. One thread per launcher.
batch_size = 8
progress = true
progress_interval_seconds = 30.0

[temporal_constraints]
# Absolute change from the preceding interval, in modulation-value units.
# Entry 1 is anchored to its baseline value. Earlier intervals stay frozen.
max_step = 0.15
# Soft preferences inspired by MocosSimCMAESOptimizer; reversals remain possible.
smoothness_weight = 0.20
reversal_weight = 0.10

[search]
start_day = 14
step_days = 14
end_day = 84
# Alternatively: horizons = [14, 28, 56, 84] (remove the three day settings above).
survivors = 12
random_starts = 48
trials_per_survivor = 8
repetitions = 3
max_rounds_per_horizon = 5
score_tolerance = 0.5
require_tolerance = true
initial_radius = 0.20
radius_decay = 0.75
min_separation = 0.03
seed = 42
checkpoint_dir = "../runs/saxony-temporal/checkpoints"

[scoring]
# Both observations and predictions use trailing averages. 1 disables smoothing.
smoothing_days = 7

[[parameters]]
name = "school"
path = "transmission_probabilities.school"
lower = 0.12
upper = 0.30

[[parameters]]
name = "class"
path = "transmission_probabilities.class"
lower = 0.14
upper = 0.40

[[parameters]]
name = "age_coupling"
path = "transmission_probabilities.age_coupling_param"
lower = 0.44
upper = 0.64

[[metrics]]
name = "daily_detections"
file = "${MOCOSSIM_GT_DIR}/daily_detections.csv"
weight = 1.0
# Optional fixed normalization: scale = 100.0

[[metrics]]
name = "daily_deaths"
file = "${MOCOSSIM_GT_DIR}/daily_deaths.csv"
weight = 1.0

# Only the entry containing the current horizon is fitted in each vector.
# Earlier entries stay attached to each survivor; future entries retain baseline values.
[[temporal_parameters]]
path = "infection_modulation"
lower = 0.05
upper = 1.00

[[temporal_parameters]]
path = "mild_detection_modulation"
lower = 0.05
upper = 1.00

[[temporal_parameters]]
path = "tracing_modulation"
lower = 0.05
upper = 1.00
